<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gecky</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}" />
</head>
<body>

  <!-- ═══════════════════════════════════════════════════════════════════════
       LEFT SIDEBAR — workspace list
  ════════════════════════════════════════════════════════════════════════ -->
  <aside id="sidebar" class="sidebar">
    <div class="sidebar-header">
      <span class="logo">🦎 Gecky</span>
      <button id="toggle-sidebar" title="Collapse sidebar" aria-label="Toggle sidebar">◀</button>
    </div>

    <div class="sidebar-content">
      <button id="new-workspace-btn" class="btn-primary sidebar-btn">+ New Workspace</button>

      <ul id="workspace-list" aria-label="Workspaces">
        {% for ws in workspaces %}
        <li class="workspace-item {% if active_workspace and ws.id == active_workspace.id %}active{% endif %}"
            data-workspace-id="{{ ws.id }}">
          <span class="workspace-name">{{ ws.name }}</span>
          <button class="delete-workspace-btn" data-id="{{ ws.id }}" title="Delete workspace" aria-label="Delete {{ ws.name }}">✕</button>
        </li>
        {% endfor %}
      </ul>

      <div class="private-link-section">
        <p class="private-link-label">🔒 Your private board</p>
        <button id="copy-link-btn" class="btn-secondary sidebar-btn" title="Copy link to bookmark this board">Copy Link</button>
      </div>
    </div>
  </aside>

  <!-- ═══════════════════════════════════════════════════════════════════════
       MAIN BOARD — draggable geck cards
  ════════════════════════════════════════════════════════════════════════ -->
  <main id="board-wrapper">
    <header class="board-header">
      <h1 id="workspace-title">
        {{ active_workspace.name if active_workspace else 'No Workspace' }}
      </h1>
      <button id="add-geck-btn" class="btn-primary">+ Geck</button>
    </header>

    <!-- Absolute-positioned canvas; gecks rendered by main.js from window.GECKY -->
    <div id="board" role="main" aria-label="Task board"></div>
  </main>

  <!-- ═══════════════════════════════════════════════════════════════════════
       NEW GECK MODAL
  ════════════════════════════════════════════════════════════════════════ -->
  <div id="geck-modal" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="modal-heading">
    <div class="modal-card">
      <h3 id="modal-heading">New Geck</h3>
      <input  id="geck-title-input"
              type="text"
              placeholder="Title"
              maxlength="200"
              autocomplete="off"
              aria-label="Geck title" />
      <div class="modal-actions">
        <button id="cancel-geck-btn" class="btn-secondary">Cancel</button>
        <button id="save-geck-btn"   class="btn-primary">Add Geck</button>
      </div>
    </div>
  </div>

  <!-- ═══════════════════════════════════════════════════════════════════════
       AI PANEL — bottom centre
  ════════════════════════════════════════════════════════════════════════ -->
  <div id="ai-panel" role="complementary" aria-label="AI task generator">
    <div class="ai-panel-inner">
      <input  type="text"
              id="ai-prompt"
              placeholder='Try "Generate a morning routine" …'
              autocomplete="off"
              aria-label="AI prompt" />
      <button id="ask-gecky-btn" class="btn-ai">Ask Gecky</button>
    </div>
  </div>

  <!-- Toast container (injected by JS) -->
  <div id="toast-container" aria-live="polite"></div>

  <!-- ═══════════════════════════════════════════════════════════════════════
       BOOTSTRAP DATA — passed from Flask to JS
  ════════════════════════════════════════════════════════════════════════ -->
  <script>
    window.GECKY = {
      activeWorkspaceId : {{ active_workspace.id if active_workspace else 'null' }},
      workspaces        : {{ workspaces_json | safe }},
      gecks             : {{ gecks_json      | safe }}
    };
  </script>

  <!-- drag.js must load before main.js so makeDraggable() is available -->
  <script src="{{ url_for('static', filename='js/drag.js') }}"></script>
  <script src="{{ url_for('static', filename='js/main.js') }}"></script>

  <script>
    (function () {
      var btn = document.getElementById('copy-link-btn');
      if (!btn) return;
      btn.addEventListener('click', function () {
        navigator.clipboard.writeText(window.location.href).then(function () {
          var orig = btn.textContent;
          btn.textContent = 'Copied!';
          btn.disabled = true;
          setTimeout(function () {
            btn.textContent = orig;
            btn.disabled = false;
          }, 2000);
        });
      });
    })();
  </script>
</body>
</html>
</html>
